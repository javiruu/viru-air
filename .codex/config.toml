model_context_window = 372000
[mcp_servers.chrome-devtools]
command = "npx"
args = [ "-y", "chrome-devtools-mcp@latest", "--no-usage-statistics", "--isolated" ]

[mcp_servers.serena]
command = "serena"
args = [ "start-mcp-server", "--context", "codex", "--project-from-cwd", "--open-web-dashboard", "false" ]
startup_timeout_sec = 90

[mcp_servers.serena.env]
SERENA_LOG_LEVEL = "info"

[features]
goals = true
child_agents_md = true

hooks = true
[analytics]
enabled = false

[feedback]
enabled = false

[features.multi_agent_v2]
max_concurrent_threads_per_session = 1000

[projects.'C:\Users\javiru\Desktop\viru-tracker']
trust_level = "trusted"
approval_policy = "never"
