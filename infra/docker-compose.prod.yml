version: "3.9"
# Production-oriented compose profile.
# Override DOMAIN via .env or environment, e.g.:
#   DOMAIN=virutracker.dpdns.org docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  backend:
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-}
      CORS_ALLOW_ORIGIN_REGEX: ${CORS_ALLOW_ORIGIN_REGEX:-}

  frontend:
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}

volumes:
  caddy_data:
  caddy_config:
