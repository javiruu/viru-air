name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Backend tests
        run: |
          cd backend
          pip install -e .[dev]
          pytest -q
      - name: Frontend build
        run: |
          cd frontend
          npm install
          npm run build
      - name: Build backend image (no push)
        run: docker build --file backend/Dockerfile --tag viru-backend:release backend

  publish-image:
    needs: [quality-gates]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image reference
        id: image
        run: |
          echo "name=ghcr.io/${{ github.repository }}/${{ vars.IMAGE_NAME || 'backend' }}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  canary-deploy:
    needs: [publish-image]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Deploy canary 5% -> 25% -> 50% -> 100%"
      - run: echo "If SLI degrades, rollback immediately"
