apiVersion: batch/v1
kind: Job
metadata:
  name: viru-hotels-migrate
  labels:
    app: viru-hotels-migrate
    component: hotel-tracking
spec:
  # Safe by default: run only after reviewing the target DB and release.
  suspend: true
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: viru-hotels-migrate
        component: hotel-tracking
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      restartPolicy: Never
      terminationGracePeriodSeconds: 30
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: migrate
          # Replace the configurable placeholder with the same approved
          # immutable image used by the API and sweep CronJob.
          image: ghcr.io/your-org/viru-backend:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command: ["alembic", "upgrade", "head"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          env:
            - name: APP_ENV
              value: "staging"
            - name: LOG_FILE
              value: "/tmp/viru.log"
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: viru-backend-runtime
                  key: DB_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: viru-backend-runtime
                  key: JWT_SECRET
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
