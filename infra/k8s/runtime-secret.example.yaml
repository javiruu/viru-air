# TEMPLATE ONLY — never commit real credentials.
#
# Prefer creating the Secret imperatively so the value never lives in a file:
#   kubectl create secret generic viru-backend-runtime \
#     --from-literal=DB_URL='postgresql://user:pass@host:5432/viru' \
#     --from-literal=JWT_SECRET='<openssl rand -hex 32>' \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# If a manifest is unavoidable, copy this file, fill stringData with real
# values, apply it, and delete the file. Keep placeholders in version control.
apiVersion: v1
kind: Secret
metadata:
  name: viru-backend-runtime
  labels:
    app: viru-backend
    component: hotel-tracking
type: Opaque
stringData:
  # Required by backend/app/core/security.py (JWT_SECRET) and by the API,
  # sweep CronJob and migration Job containers (DB_URL).
  DB_URL: "postgresql://USER:PASSWORD@HOST:5432/viru"
  JWT_SECRET: "REPLACE_WITH_64_RANDOM_HEX"
  # Optional: defaults to JWT_SECRET when unset.
  # TOKEN_HASH_SECRET: "REPLACE_WITH_ANOTHER_64_RANDOM_HEX"
