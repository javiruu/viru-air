[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "viru-backend"
version = "0.1.0"
description = "Backend base de Viru"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn>=0.35.0",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14.0",
  "pydantic[email]>=2.10.0",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "python-multipart>=0.0.20",
  "requests>=2.32.3",
  "httpx>=0.28.0",
  "httpx2[http2,brotli,zstd]",
  "psycopg[binary]>=3.2.0",
  "curl_cffi>=0.15.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.2",
  "mypy>=1.13.0",
  "types-python-jose>=3.5.0.20260408",
  "types-passlib>=1.7.7.20260211",
  "redis>=8.0.0",
]
browser = [
  "playwright>=1.48.0"
]
redis = [
  "redis>=5.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: marks tests that touch external services (live network).",
    "network: marks tests that perform outbound HTTP.",
]


[tool.ruff]
line-length = 100


[tool.setuptools]
packages = ["app"]

